name: Extensions

on:
  pull_request:
    paths:
      - 'extensions/**'
      - 'scripts/**'
      - 'examples/sidecar-scaffold/**'
      - 'examples/loopback-sidecar/**'
      - 'README.md'
      - 'docs/extension-entry.md'
      - 'docs/compatibility-smoke.md'
      - 'docs/SIDECAR_CONTRACT.md'
      - 'docs/rfcs/0001-extension-json-schema.md'
      - 'tests/compatibility/**'
      - '.github/workflows/extensions.yml'
  push:
    branches:
      - main
    paths:
      - 'extensions/**'
      - 'scripts/**'
      - 'examples/sidecar-scaffold/**'
      - 'examples/loopback-sidecar/**'
      - 'README.md'
      - 'docs/extension-entry.md'
      - 'docs/compatibility-smoke.md'
      - 'docs/SIDECAR_CONTRACT.md'
      - 'docs/rfcs/0001-extension-json-schema.md'
      - 'tests/compatibility/**'
      - '.github/workflows/extensions.yml'

concurrency:
  group: extensions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate extensions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate extension entries
        run: node scripts/validate-extensions.mjs

      - name: Test extension validator
        run: node scripts/test-extension-validator.mjs

      - name: Test Typography
        run: |
          node scripts/test-typography-configure.mjs
          node scripts/test-typography.mjs

      - name: Test Message Pins observer sync
        run: node scripts/test-message-pins-sync.mjs

      - name: Test Mobile Haptics E0/B1 lifecycle
        run: node scripts/test-mobile-haptics.mjs

      - name: Test sidecar contract enforcement
        run: node scripts/test-sidecar-contract.mjs

      - name: Test canonical sidecar scaffold
        run: python scripts/test-sidecar-scaffold.py

      - name: Test Profile Avatars
        run: python scripts/test-profile-avatars.py

      - name: Test sysinfo sidecar regressions (op/bulk ownership + update-target parity)
        run: |
          python extensions/sysinfo/sidecar/test_op_ownership.py
          python extensions/sysinfo/sidecar/test_update_target_parity.py

      - name: Test auto-list keyboard contracts
        run: node --test scripts/test-auto-list-keyboard.mjs

      - name: Scan extension safety gates
        run: node scripts/scan-extension-safety.mjs

      - name: Check sidecar scaffold is in sync
        run: node scripts/sync-sidecar-base.mjs --check

      - name: Check sidecar usage (no rogue servers / correct ExecStart)
        run: node scripts/check-sidecar-usage.mjs

      - name: Validate Desktop Companion and loopback example
        run: node scripts/validate-desktop-companion.mjs

      - name: Generate registry
        run: node scripts/generate-registry.mjs --out dist/registry.json

      - name: Validate generated registry JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('dist/registry.json','utf8'))"

      - name: Upload registry artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: extension-registry-and-artifacts
          path: dist

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy-pages:
    name: Deploy registry to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  browser-compatibility:
    name: Browser extension compatibility
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out extension repository
        # v5 @ fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Check out Hermes WebUI Core
        # v5 @ fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: nesquena/hermes-webui
          # Pin the independently verified Core contract; update this SHA only
          # after a maintainer reruns the smoke against the new Core head.
          # exp-v0.52.241 — first release carrying the cooperative E0
          # identity handle, B1 turn-lifecycle event contract, and scoped
          # Configure hook.
          ref: b1c2bea92ee8369797d051a0e0789968bd351343
          path: .ci/hermes-webui-core
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        # v5 @ a26af69be951a213d495a4c3e4e4022e16d87065
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install browser compatibility dependencies
        run: python -m pip install --require-hashes -r tests/compatibility/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test browser compatibility harness
        run: python -m unittest discover -s tests/compatibility -p 'test_*.py' -v

      - name: Run real Core browser compatibility smoke
        env:
          HERMES_CORE_DIR: .ci/hermes-webui-core
          COMPATIBILITY_EVIDENCE_DIR: compatibility-evidence
        run: |
          mkdir -p "$COMPATIBILITY_EVIDENCE_DIR"
          python tests/compatibility/browser_smoke.py

      - name: Run E0/B1/Configure capability smoke
        env:
          HERMES_CORE_DIR: .ci/hermes-webui-core
          COMPATIBILITY_EVIDENCE_DIR: compatibility-evidence
        run: python tests/compatibility/capability_smoke.py

      - name: Run Typography browser compatibility smoke
        env:
          HERMES_CORE_DIR: .ci/hermes-webui-core
          COMPATIBILITY_EVIDENCE_DIR: compatibility-evidence
        run: python tests/compatibility/typography_smoke.py

      - name: Upload browser compatibility evidence
        if: always()
        # v5 @ 330a01c490aca151604b8cf639adc76d48f6c5d4
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: extension-compatibility-evidence
          path: compatibility-evidence
          if-no-files-found: warn
          retention-days: 7
